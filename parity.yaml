settings:
  namespace_roots:
    src: Src
    tests: Tests
  source_extension: ".ts"
  test_suffix: ".test"
  test_extension: ".ts"
  namespace_separator: "."

coverage_xml: .parity/per-test
min_coverage: 70
min_coverage_global: 80
min_matched_coverage: 40

test:
  command: "./node_modules/.bin/c8 --include='src/**/*.ts' --reporter=clover --reports-dir=$(dirname {coverage}) ./node_modules/.bin/tsx --test {test_abs}"
  coverage: ".parity/tmp/{slug}/clover.xml"
  reports: ".parity/per-test"
  timeout: 300

structure:
  - name: "TypeScript Utilities"
    paths:
      source: "src"
      test: "tests"
    rules:
      - minimum-coverage:
          min: 70
      - matched-coverage:
          min: 40
